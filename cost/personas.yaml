# Mô phỏng chi phí khi dùng thật — Track D: Xử lý khiếu nại đơn giao đồ ăn thiếu món
# Cơ sở: spec.md §1, §2, §8

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng gặp sự cố cần hỗ trợ bồi thường mỗi tháng
  low: 1000
  base: 3000
  high: 6000
  source: "spec.md §1 & §2: quy mô 100.000 đơn hàng/tháng với tỷ lệ sự cố thiếu/sai món 3% (từ 2.000 review Google Play: ShopeeFood 3.0%, GrabFood 0.58%), tương đương 3.000 ca khiếu nại/tháng ở kịch bản cơ sở (base). Thấp (1.000) và cao (6.000) tự ước tính theo biến động lượng đơn."

personas:           # 3 nhóm khách hàng theo spec.md §2; share cộng lại = 1.0
  - name: khach_thinh_thoang
    share: 0.60              # 60% người dùng
    uses_per_month: 1       # 1 lần khiếu nại / tháng khi gặp sự cố
    turns_per_session: 1    # 1 lượt hỏi là xong (nhận bồi thường hoặc chuyển hỗ trợ)
    source: "spec.md §2: Khách thỉnh thoảng đặt (2–4 đơn/tháng), khiếu nại 1 lần / vài tháng (làm tròn 1 lần/tháng vào hệ thống)"
  - name: khach_van_phong
    share: 0.35              # 35% người dùng
    uses_per_month: 2       # 2 lần khiếu nại / tháng
    turns_per_session: 2    # 2 lượt (trao đổi, hỏi lại tên món hoặc xác nhận)
    source: "spec.md §2: Khách văn phòng đặt thường xuyên 15–20 đơn/tháng, khiếu nại 1–2 lần/tháng"
  - name: khach_lam_dung
    share: 0.05              # 5% người dùng
    uses_per_month: 4       # 4 lần khiếu nại / tháng
    turns_per_session: 3    # 3 lượt (năn nỉ, dọa bóc phốt, chuyển CSKH)
    source: "spec.md §2: Nhóm tài khoản khiếu nại bất thường / nhiều lần (4–5 lần/tháng)"

prices:             # USD / 1 triệu token
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/pricing (Google AI Studio 2026)"
  - model: openai/gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://openai.com/api/pricing (2026)"

usd_to_vnd:
  rate: 25400
  source: "Tỷ giá Vietcombank ngày 27/11/2026"
